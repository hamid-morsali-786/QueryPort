<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="100%" height="100%" style="background: transparent; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;">

    <defs>
      <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
      </filter>
    </defs>
    
  <g filter="url(#card-shadow)">
    <rect x="10" y="10" width="880" height="456" rx="10" ry="10" fill="#0a0f18" stroke="#1e293b" stroke-width="1.2" />
  </g>
  <rect x="10" y="10" width="880" height="38" rx="10" ry="10" fill="#111827" />
  <!-- Header bottom square fill to preserve round top corners -->
  <rect x="10" y="38" width="880" height="10" fill="#111827" />
  <line x1="10" y1="48" x2="890" y2="48" stroke="#1e293b" stroke-width="1" />
  <circle cx="32" cy="29" r="6" fill="#ef4444" />
  <circle cx="52" cy="29" r="6" fill="#f59e0b" />
  <circle cx="72" cy="29" r="6" fill="#10b981" />
  <text x="450" y="33" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">QueryPort - Atomic All-or-Nothing Transaction Mode</text>
  <text x="24" y="72" font-size="13" xml:space="preserve"><tspan fill="#38bdf8" font-weight="bold">PS C:\QueryPort&gt; </tspan><tspan fill="#f8fafc" font-weight="bold">.\QueryPort.exe </tspan><tspan fill="#ffffff" font-weight="bold">import </tspan><tspan fill="#facc15" font-weight="normal">--path </tspan><tspan fill="#93c5fd" font-weight="normal">imports/gl_journal.csv </tspan><tspan fill="#facc15" font-weight="normal">--commit-mode </tspan><tspan fill="#4ade80" font-weight="normal">all</tspan></text>
  <text x="24" y="116" font-size="13" xml:space="preserve"><tspan fill="#38bdf8" font-weight="normal">=== QueryPort - Oracle CSV Importer ===</tspan></text>
  <text x="24" y="138" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Target Path    : </tspan><tspan fill="#ffffff" font-weight="bold">imports/gl_journal.csv</tspan></text>
  <text x="24" y="160" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Commit Mode    : </tspan><tspan fill="#4ade80" font-weight="normal">all (Single Atomic Transaction Guarantee)</tspan></text>
  <text x="24" y="182" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Existing Data  : </tspan><tspan fill="#cbd5e1" font-weight="normal">append</tspan></text>
  <text x="24" y="204" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">--------------------------------------------------------------------------------</tspan></text>
  <text x="24" y="226" font-size="13" xml:space="preserve"><tspan fill="#4ade80" font-weight="normal">[OK] </tspan><tspan fill="#cbd5e1" font-weight="normal">Connected to Oracle Database successfully.</tspan></text>
  <text x="24" y="248" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[11:30:00] </tspan><tspan fill="#38bdf8" font-weight="normal">[TX]     </tspan><tspan fill="#cbd5e1" font-weight="normal">Transaction initiated. Auto-commit disabled.</tspan></text>
  <text x="24" y="270" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[11:30:01] </tspan><tspan fill="#38bdf8" font-weight="normal">[STREAM] </tspan><tspan fill="#cbd5e1" font-weight="normal">Streaming chunk 1 (rows 1-5,000)... </tspan><tspan fill="#64748b" font-weight="normal">[Buffer buffered in Undo]</tspan></text>
  <text x="24" y="292" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[11:30:02] </tspan><tspan fill="#38bdf8" font-weight="normal">[STREAM] </tspan><tspan fill="#cbd5e1" font-weight="normal">Streaming chunk 2 (rows 5,001-10,000)... </tspan><tspan fill="#64748b" font-weight="normal">[Buffer buffered in Undo]</tspan></text>
  <text x="24" y="314" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[11:30:03] </tspan><tspan fill="#38bdf8" font-weight="normal">[STREAM] </tspan><tspan fill="#cbd5e1" font-weight="normal">Streaming chunk 3 (rows 10,001-14,500)... </tspan><tspan fill="#64748b" font-weight="normal">[Buffer buffered in Undo]</tspan></text>
  <text x="24" y="336" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[11:30:03] </tspan><tspan fill="#c084fc" font-weight="normal">[VERIFY] </tspan><tspan fill="#cbd5e1" font-weight="normal">All 14,500 rows inserted without error. Issuing single final COMMIT...</tspan></text>
  <text x="24" y="358" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[11:30:04] </tspan><tspan fill="#4ade80" font-weight="normal">[COMMIT] </tspan><tspan fill="#ffffff" font-weight="bold">Transaction committed atomically. Data integrity guaranteed.</tspan></text>
  <text x="24" y="402" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">================================================================================</tspan></text>
  <text x="24" y="424" font-size="13" xml:space="preserve"><tspan fill="#ffffff" font-weight="bold">TOTALS: 1 Tables | 14,500 Read | 14,500 Imported | 0 Failed in 3.65s (Atomic)</tspan></text>
  <text x="24" y="446" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">================================================================================</tspan></text>
</svg>