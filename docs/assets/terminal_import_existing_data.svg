<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="100%" height="100%" style="background: transparent; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;">

    <defs>
      <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
      </filter>
    </defs>
    
  <g filter="url(#card-shadow)">
    <rect x="10" y="10" width="880" height="412" rx="10" ry="10" fill="#0a0f18" stroke="#1e293b" stroke-width="1.2" />
  </g>
  <rect x="10" y="10" width="880" height="38" rx="10" ry="10" fill="#111827" />
