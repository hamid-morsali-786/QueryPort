  <text x="460" y="33" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">QueryPort - High-Throughput Parallel Export</text>
  <text x="24" y="72" font-size="13" xml:space="preserve"><tspan fill="#38bdf8" font-weight="bold">PS C:\QueryPort&gt; </tspan><tspan fill="#f8fafc" font-weight="bold">.\QueryPort.exe </tspan><tspan fill="#facc15" font-weight="normal">--path </tspan><tspan fill="#93c5fd" font-weight="normal">sql_queries </tspan><tspan fill="#facc15" font-weight="normal">--format </tspan><tspan fill="#93c5fd" font-weight="normal">both </tspan><tspan fill="#facc15" font-weight="normal">--batch-size </tspan><tspan fill="#a7f3d0" font-weight="normal">10000 </tspan><tspan fill="#facc15" font-weight="normal">--workers </tspan><tspan fill="#a7f3d0" font-weight="normal">4</tspan></text>
  <text x="24" y="116" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:02] </tspan><tspan fill="#38bdf8" font-weight="normal">[CONFIG] </tspan><tspan fill="#cbd5e1" font-weight="normal">Loaded configuration from &#x27;config.json&#x27; (Environment: Production)</tspan></text>
  <text x="24" y="138" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:02] </tspan><tspan fill="#38bdf8" font-weight="normal">[ORACLE] </tspan><tspan fill="#cbd5e1" font-weight="normal">Connected via direct TCP to </tspan><tspan fill="#ffffff" font-weight="bold">db-prod.internal:1521/SRV_REPORTING</tspan></text>
  <text x="24" y="160" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:02] </tspan><tspan fill="#38bdf8" font-weight="normal">[DISPATCH] </tspan><tspan fill="#cbd5e1" font-weight="normal">Discovered 3 SQL scripts in &#x27;sql_queries/&#x27;:</tspan></text>
  <text x="24" y="182" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">           -&gt; </tspan><tspan fill="#93c5fd" font-weight="normal">monthly_sales.sql</tspan><tspan fill="#64748b" font-weight="normal"> (Complex analytical aggregation)</tspan></text>
  <text x="24" y="204" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">           -&gt; </tspan><tspan fill="#93c5fd" font-weight="normal">customer_audit.sql</tspan><tspan fill="#64748b" font-weight="normal"> (Compliance transaction audit)</tspan></text>
  <text x="24" y="226" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">           -&gt; </tspan><tspan fill="#93c5fd" font-weight="normal">inventory_snapshot.sql</tspan><tspan fill="#64748b" font-weight="normal"> (Warehouse inventory state)</tspan></text>
  <text x="24" y="270" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:03] </tspan><tspan fill="#c084fc" font-weight="normal">[Worker-1] </tspan><tspan fill="#cbd5e1" font-weight="normal">Executing &#x27;monthly_sales.sql&#x27; [arraysize=10000]...</tspan></text>
