  <text x="24" y="578" font-size="13" xml:space="preserve"><tspan fill="#ffffff" font-weight="bold">Execution Time: </tspan><tspan fill="#a7f3d0" font-weight="normal">23.4 seconds</tspan><tspan fill="#64748b" font-weight="normal"> | </tspan><tspan fill="#ffffff" font-weight="bold">Effective Throughput: </tspan><tspan fill="#4ade80" font-weight="normal">18,275 rows/sec</tspan></text>
