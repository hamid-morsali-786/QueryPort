  <text x="24" y="314" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:03] </tspan><tspan fill="#c084fc" font-weight="normal">[Worker-3] </tspan><tspan fill="#cbd5e1" font-weight="normal">Executing &#x27;inventory_snapshot.sql&#x27; [arraysize=10000]...</tspan></text>
  <text x="24" y="358" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:08] </tspan><tspan fill="#38bdf8" font-weight="normal">[STREAM]  </tspan><tspan fill="#93c5fd" font-weight="normal">monthly_sales.sql: </tspan><tspan fill="#a7f3d0" font-weight="normal">100,000</tspan><tspan fill="#cbd5e1" font-weight="normal"> rows fetched </tspan><tspan fill="#64748b" font-weight="normal">(Memory: 14.2 MB)</tspan></text>
  <text x="24" y="380" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:14] </tspan><tspan fill="#38bdf8" font-weight="normal">[STREAM]  </tspan><tspan fill="#93c5fd" font-weight="normal">monthly_sales.sql: </tspan><tspan fill="#a7f3d0" font-weight="normal">250,000</tspan><tspan fill="#cbd5e1" font-weight="normal"> rows fetched </tspan><tspan fill="#64748b" font-weight="normal">(Memory: 14.8 MB)</tspan></text>
  <text x="24" y="402" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:18] </tspan><tspan fill="#4ade80" font-weight="normal">[SUCCESS] </tspan><tspan fill="#cbd5e1" font-weight="normal">Exported </tspan><tspan fill="#93c5fd" font-weight="normal">monthly_sales.sql</tspan><tspan fill="#cbd5e1" font-weight="normal"> -&gt; </tspan><tspan fill="#ffffff" font-weight="bold">exports/monthly_sales.csv</tspan><tspan fill="#64748b" font-weight="normal"> (284,120 rows) [15.2s]</tspan></text>
  <text x="24" y="424" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:19] </tspan><tspan fill="#4ade80" font-weight="normal">[SUCCESS] </tspan><tspan fill="#cbd5e1" font-weight="normal">Exported </tspan><tspan fill="#93c5fd" font-weight="normal">monthly_sales.sql</tspan><tspan fill="#cbd5e1" font-weight="normal"> -&gt; </tspan><tspan fill="#ffffff" font-weight="bold">exports/monthly_sales.xlsx</tspan><tspan fill="#64748b" font-weight="normal"> (Formatted Sheet) [Done]</tspan></text>
  <text x="24" y="446" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:21] </tspan><tspan fill="#4ade80" font-weight="normal">[SUCCESS] </tspan><tspan fill="#cbd5e1" font-weight="normal">Exported </tspan><tspan fill="#93c5fd" font-weight="normal">customer_audit.sql</tspan><tspan fill="#cbd5e1" font-weight="normal"> -&gt; </tspan><tspan fill="#ffffff" font-weight="bold">exports/customer_audit.csv</tspan><tspan fill="#64748b" font-weight="normal"> (51,430 rows) [8.1s]</tspan></text>
  <text x="24" y="468" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">[10:14:26] </tspan><tspan fill="#4ade80" font-weight="normal">[SUCCESS] </tspan><tspan fill="#cbd5e1" font-weight="normal">Exported </tspan><tspan fill="#93c5fd" font-weight="normal">inventory_snapshot.sql</tspan><tspan fill="#cbd5e1" font-weight="normal"> -&gt; </tspan><tspan fill="#ffffff" font-weight="bold">exports/inventory_snapshot.csv</tspan><tspan fill="#64748b" font-weight="normal"> (92,100 rows) [11.4s]</tspan></text>
