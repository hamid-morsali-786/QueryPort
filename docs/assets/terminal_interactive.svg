  <text x="24" y="776" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">01   </tspan><tspan fill="#cbd5e1" font-weight="normal">SALES_DATA                </tspan><tspan fill="#a7f3d0" font-weight="normal">154,200      </tspan><tspan fill="#4ade80" font-weight="normal">154,200      </tspan><tspan fill="#cbd5e1" font-weight="normal">0          </tspan><tspan fill="#a7f3d0" font-weight="normal">6.42s     </tspan></text>
  <text x="24" y="798" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">--------------------------------------------------------------------------------</tspan></text>
