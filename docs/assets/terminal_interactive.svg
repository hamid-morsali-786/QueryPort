  <text x="450" y="33" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">QueryPort - Unified Interactive Console</text>
  <text x="24" y="72" font-size="13" xml:space="preserve"><tspan fill="#38bdf8" font-weight="bold">PS C:\QueryPort&gt; </tspan><tspan fill="#f8fafc" font-weight="bold">.\QueryPort.exe</tspan></text>
  <text x="24" y="116" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">==================================================</tspan></text>
  <text x="24" y="138" font-size="13" xml:space="preserve"><tspan fill="#ffffff" font-weight="bold">           QueryPort Unified Console              </tspan></text>
  <text x="24" y="160" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">==================================================</tspan></text>
  <text x="24" y="182" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Select Operation:</tspan></text>
  <text x="24" y="204" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">  [1 / E] : </tspan><tspan fill="#cbd5e1" font-weight="normal">Export Database queries to CSV / SQL Insert (config.json)</tspan></text>
  <text x="24" y="226" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">  [2 / I] : </tspan><tspan fill="#cbd5e1" font-weight="normal">Import CSV datasets into Database tables  (config.json)</tspan></text>
  <text x="24" y="248" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">  [exit/q]: </tspan><tspan fill="#cbd5e1" font-weight="normal">Exit program</tspan></text>
  <text x="24" y="292" font-size="13" xml:space="preserve"><tspan fill="#38bdf8" font-weight="bold">Enter choice: </tspan><tspan fill="#f8fafc" font-weight="bold">2</tspan></text>
  <text x="24" y="336" font-size="13" xml:space="preserve"><tspan fill="#38bdf8" font-weight="normal">=== QueryPort - Oracle CSV Importer ===</tspan></text>
  <text x="24" y="358" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Target Path    : </tspan><tspan fill="#ffffff" font-weight="bold">imports/sales_data.csv</tspan></text>
  <text x="24" y="380" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Target Schema  : </tspan><tspan fill="#93c5fd" font-weight="normal">APP_USER</tspan></text>
  <text x="24" y="402" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Commit Mode    : </tspan><tspan fill="#cbd5e1" font-weight="normal">batch (Batch: 5000)</tspan></text>
  <text x="24" y="424" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Existing Data  : </tspan><tspan fill="#cbd5e1" font-weight="normal">append</tspan></text>
  <text x="24" y="446" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Error Strategy : </tspan><tspan fill="#cbd5e1" font-weight="normal">abort</tspan></text>
  <text x="24" y="468" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">--------------------------------------------------------------------------------</tspan></text>
  <text x="24" y="490" font-size="13" xml:space="preserve"><tspan fill="#4ade80" font-weight="normal">[OK] </tspan><tspan fill="#cbd5e1" font-weight="normal">Connected to Oracle Database successfully (Thin direct TCP).</tspan></text>
  <text x="24" y="512" font-size="13" xml:space="preserve"><tspan fill="#cbd5e1" font-weight="normal">Running pre-import data dictionary validation...</tspan></text>
  <text x="24" y="534" font-size="13" xml:space="preserve"><tspan fill="#4ade80" font-weight="normal">[OK] </tspan><tspan fill="#cbd5e1" font-weight="normal">All tables and column structures verified successfully.</tspan></text>
  <text x="24" y="578" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">    -&gt; [SALES_DATA] Result: </tspan><tspan fill="#a7f3d0" font-weight="normal">154,200 rows</tspan><tspan fill="#cbd5e1" font-weight="normal"> imported in </tspan><tspan fill="#4ade80" font-weight="normal">6.42s</tspan></text>
  <text x="24" y="622" font-size="13" xml:space="preserve"><tspan fill="#64748b" font-weight="normal">================================================================================</tspan></text>
